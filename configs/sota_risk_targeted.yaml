engine:
  initial_cash: 1000000
  allow_fractional: false
  rebalance_threshold: 0.005
  cash_buffer: 0.02

costs:
  commission_rate: 0.0003
  slippage_bps: 2
  spread_bps: 1
  market_impact: 0.10
  annual_cash_rate: 0.015
  annual_borrow_rate: 0.03
  annual_margin_rate: 0.06

risk:
  max_position_weight: 0.35
  max_gross_leverage: 1.50
  max_group_weight: 0.75
  max_drawdown: 0.22
  drawdown_cooldown_days: 20
  allow_short: true
  target_volatility: 0.10
  volatility_lookback: 60
  fast_volatility_lookback: 20
  min_volatility_scale: 0.25
  max_volatility_scale: 1.50
  max_daily_turnover: 0.50
  max_volume_participation: 0.03
  drawdown_soft_limit: 0.10
  minimum_drawdown_scale: 0.50
  asset_groups:
    VTI: equity
    QQQ: equity
    IWM: equity
    EFA: equity
    EEM: equity
    VNQ: real_estate
    TLT: rates
    IEF: rates
    TIP: inflation
    GLD: inflation
    DBC: inflation
    BIL: cash

strategy:
  name: multi_horizon_trend

data:
  type: yahoo
  symbols: [VTI, QQQ, IWM, EFA, EEM, VNQ, TLT, IEF, TIP, GLD, DBC, BIL]
  start: "2008-01-01"
  end: "2026-08-13"
  cache_path: data/sota_multi_asset.csv
  prefer_cache: true
  panel_alignment: intersection
