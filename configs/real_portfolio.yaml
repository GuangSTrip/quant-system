engine:
  initial_cash: 1000000
  allow_fractional: false
  rebalance_threshold: 0.005
  cash_buffer: 0.02

costs:
  commission_rate: 0.0003
  slippage_bps: 2
  spread_bps: 1
  market_impact: 0.10
  annual_cash_rate: 0.015

risk:
  max_position_weight: 0.35
  max_gross_leverage: 0.98
  max_drawdown: 0.18
  drawdown_cooldown_days: 20
  allow_short: false
  target_volatility: 0.14
  volatility_lookback: 60
  min_volatility_scale: 0.30
  max_volatility_scale: 1.0
  max_daily_turnover: 0.40
  max_volume_participation: 0.03

strategy:
  name: ensemble
  sleeves:
    - name: trend
      weight: 0.50
      params:
        medium_window: 84
        long_window: 252
        volatility_window: 40
        allocation: 0.98
        rebalance_interval: 5
    - name: cross_sectional_momentum
      weight: 0.50
      params:
        lookback: 126
        skip: 5
        top_k: 3
        volatility_window: 40
        allocation: 0.98
        rebalance_interval: 21

data:
  type: yahoo
  symbols: [SPY, QQQ, IWM, TLT, GLD]
  start: "2006-01-01"
  end: "2026-08-13"
  cache_path: data/etf_market.csv
  prefer_cache: true

