engine:
  initial_cash: 1000000
  allow_fractional: false
  rebalance_threshold: 0.005
  cash_buffer: 0.02

costs:
  commission_rate: 0.0003
  slippage_bps: 2
  spread_bps: 1
  market_impact: 0.10
  annual_cash_rate: 0.015
  annual_borrow_rate: 0.03
  annual_margin_rate: 0.06

risk:
  max_position_weight: 0.25
  max_gross_leverage: 0.95
  max_group_weight: 0.55
  max_drawdown: 0.18
  drawdown_cooldown_days: 20
  allow_short: false
  target_volatility: 0.12
  volatility_lookback: 60
  fast_volatility_lookback: 20
  min_volatility_scale: 0.25
  max_volatility_scale: 1.0
  max_daily_turnover: 0.35
  max_volume_participation: 0.03
  drawdown_soft_limit: 0.08
  minimum_drawdown_scale: 0.50
  asset_groups:
    VTI: equity
    QQQ: equity
    IWM: equity
    EFA: equity
    EEM: equity
    VNQ: real_estate
    TLT: rates
    IEF: rates
    TIP: inflation
    GLD: inflation
    DBC: inflation
    BIL: cash

strategy:
  name: ensemble
  params:
    adaptive: true
    adaptive_lookback: 126
    minimum_history: 60
    weight_shrinkage: 0.60
    minimum_sleeve_weight: 0.10
    maximum_sleeve_weight: 0.75
  sleeves:
    - name: multi_horizon_trend
      weight: 0.60
      params:
        horizons: [21, 63, 126, 252]
        volatility_window: 40
        allocation: 0.95
        rebalance_interval: 5
        long_short: false
        signal_scale: 0.75
        target_smoothing: 0.35
    - name: cross_sectional_momentum
      weight: 0.40
      params:
        lookback: 126
        skip: 5
        top_k: 4
        volatility_window: 40
        allocation: 0.95
        rebalance_interval: 21

data:
  type: yahoo
  symbols: [VTI, QQQ, IWM, EFA, EEM, VNQ, TLT, IEF, TIP, GLD, DBC, BIL]
  start: "2008-01-01"
  end: "2026-08-13"
  cache_path: data/sota_multi_asset.csv
  prefer_cache: true
  panel_alignment: intersection
