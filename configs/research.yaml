engine:
  initial_cash: 1000000
  allow_fractional: false
  rebalance_threshold: 0.005
  cash_buffer: 0.02

costs:
  commission_rate: 0.0003
  slippage_bps: 2
  spread_bps: 1
  market_impact: 0.10

risk:
  max_position_weight: 0.35
  max_gross_leverage: 0.95
  max_drawdown: 0.20
  drawdown_cooldown_days: 20
  allow_short: false
  target_volatility: 0.12
  volatility_lookback: 60
  min_volatility_scale: 0.25
  max_volatility_scale: 1.0
  max_daily_turnover: 0.35
  max_volume_participation: 0.05

strategy:
  name: trend
  params:
    volatility_window: 40
    allocation: 0.95
    rebalance_interval: 5
    long_short: false

research:
  train_fraction: 0.70
  objective: robust_score
  minimum_trades: 10
  walk_forward_folds: 3
  bootstrap_samples: 1000
  bootstrap_block_size: 20
  parameter_grid:
    medium_window: [42, 63, 84]
    long_window: [168, 210, 252]
  cost_stress_multipliers: [1.0, 2.0, 3.0, 5.0]

data:
  type: synthetic
  symbols: [EQUITY_A, EQUITY_B, BOND, GOLD, COMMODITY, REIT]
  start: "2005-01-03"
  periods: 3780
  seed: 20260813
  drift: 0.00028
  volatility: 0.011
  autocorrelation: 0.08
