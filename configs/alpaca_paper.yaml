# Copy the strategy/risk/data sections from a frozen research configuration.
# This template intentionally cannot submit orders until enabled is changed to true.
engine:
  initial_cash: 1000000
  allow_fractional: true
  rebalance_threshold: 0.005
  cash_buffer: 0.02

risk:
  max_position_weight: 0.25
  max_gross_leverage: 0.95
  max_group_weight: 0.55
  max_drawdown: 0.18
  drawdown_cooldown_days: 20
  allow_short: false
  target_volatility: 0.12
  volatility_lookback: 60
  fast_volatility_lookback: 20
  min_volatility_scale: 0.25
  max_volatility_scale: 1.0
  max_daily_turnover: 0.35
  max_volume_participation: 0.03
  drawdown_soft_limit: 0.08
  minimum_drawdown_scale: 0.50
  asset_groups:
    VTI: equity
    QQQ: equity
    IWM: equity
    EFA: equity
    EEM: equity
    VNQ: real_estate
    TLT: rates
    IEF: rates
    TIP: inflation
    GLD: inflation
    DBC: inflation
    BIL: cash

strategy:
  name: ensemble
  params:
    adaptive: true
    adaptive_lookback: 126
    minimum_history: 60
    weight_shrinkage: 0.60
    minimum_sleeve_weight: 0.10
    maximum_sleeve_weight: 0.75
  sleeves:
    - name: multi_horizon_trend
      weight: 0.60
      params:
        horizons: [21, 63, 126, 252]
        volatility_window: 40
        allocation: 0.95
        rebalance_interval: 5
        long_short: false
        signal_scale: 0.75
        target_smoothing: 0.35
    - name: cross_sectional_momentum
      weight: 0.40
      params:
        lookback: 126
        skip: 5
        top_k: 4
        volatility_window: 40
        allocation: 0.95
        rebalance_interval: 21

data:
  symbols: [VTI, QQQ, IWM, EFA, EEM, VNQ, TLT, IEF, TIP, GLD, DBC, BIL]

paper_trading:
  enabled: false
  api_key_env: ALPACA_PAPER_API_KEY
  api_secret_env: ALPACA_PAPER_API_SECRET
  state_directory: .paper_state
  audit_log_path: reports/paper_trading/audit.jsonl
  order_prefix: quant-course
  max_retries: 3
  retry_backoff_seconds: 0.5
  reconciliation_tolerance: 0.000001
  data_feed: iex
