engine:
  initial_cash: 1000000
  rebalance_threshold: 0.005
  cash_buffer: 0.02

costs:
  commission_rate: 0.0003
  slippage_bps: 2
  spread_bps: 1
  market_impact: 0.10

risk:
  max_position_weight: 0.25
  max_gross_leverage: 0.95
  max_drawdown: 0.18
  target_volatility: 0.12
  max_daily_turnover: 0.35
  max_volume_participation: 0.05

strategy:
  name: trend
  params:
    medium_window: 63
    long_window: 252
    volatility_window: 40
    allocation: 0.95
    rebalance_interval: 5

data:
  type: yahoo
  symbols: [SPY, QQQ, IWM, TLT, GLD]
  cache_path: data/etf_market.csv
  prefer_cache: true
  start: "2006-01-01"
  end: "2026-08-13"
