[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-system"
version = "0.1.0"
description = "A small, event-driven quantitative research and backtesting system"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
longbridge = ["longbridge==4.5.0"]

[project.scripts]
quant-system = "quant_system.cli:main"

[tool.setuptools.packages.find]
include = ["quant_system*"]

[tool.setuptools.package-data]
quant_system = ["dashboard_static/*.html", "dashboard_static/*.css", "dashboard_static/*.js"]

