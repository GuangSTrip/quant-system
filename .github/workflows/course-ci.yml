name: Course delivery checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: course-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install -e .
      - name: Run complete Python suite
        run: python -m unittest discover -s tests -v
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web_platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web_platform/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Run complete platform suite with simulated broker
        run: npm test
      - run: npm run validate
      - name: Check real Worker runtime compatibility locally
        run: |
          node_modules/@cloudflare/workerd-linux-64/bin/workerd test tests/workerd/transport.capnp
          node_modules/@cloudflare/workerd-linux-64/bin/workerd test tests/workerd/auth.capnp
